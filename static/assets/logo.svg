<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#091834" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Border -->
  <path d="M 100 12 
           C 148 12, 178 30, 178 52 
           C 178 120, 142 165, 100 188 
           C 58 165, 22 120, 22 52 
           C 22 30, 52 12, 100 12 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        filter="url(#goldShadow)" />

  <!-- Inner Inset Shield Line -->
  <path d="M 100 22 
           C 140 22, 166 36, 166 56 
           C 166 112, 136 152, 100 172 
           C 64 152, 34 112, 34 56 
           C 34 36, 60 22, 100 22 Z" 
        fill="none" 
        stroke="#fcd34d" 
        stroke-width="1.5" 
        stroke-opacity="0.6" 
        stroke-dasharray="4 2" />

  <!-- Academic Cap (Top Center) -->
  <g transform="translate(100, 55)">
    <!-- Cap Diamond -->
    <polygon points="0,-16 28,-3 0,10 -28,-3" fill="url(#goldGrad)" />
    <!-- Cap Skull -->
    <path d="M -16 1 C -16 10, 16 10, 16 1 Z" fill="#b45309" />
    <!-- Tassel -->
    <path d="M 0 -3 Q 22 4, 25 18" stroke="#fcd34d" stroke-width="2" fill="none" />
    <circle cx="25" cy="19" r="2.5" fill="#fcd34d" />
  </g>

  <!-- Open Book of Knowledge (Center Left) -->
  <g transform="translate(72, 102)">
    <!-- Left Page -->
    <path d="M 0 4 Q -16 -4, -28 0 L -28 20 Q -14 16, 0 24 Z" fill="#ffffff" stroke="#0f2b5c" stroke-width="1.2" />
    <!-- Right Page -->
    <path d="M 0 4 Q 16 -4, 28 0 L 28 20 Q 14 16, 0 24 Z" fill="#f8fafc" stroke="#0f2b5c" stroke-width="1.2" />
    <!-- Book Spine -->
    <path d="M 0 4 L 0 24" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Engineering Gear (Center Right) -->
  <g transform="translate(128, 114)">
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="6" fill="#0f2b5c" />
    <!-- Gear teeth -->
    <rect x="-2" y="-18" width="4" height="4" fill="url(#goldGrad)" rx="1" />
    <rect x="-2" y="14" width="4" height="4" fill="url(#goldGrad)" rx="1" />
    <rect x="-18" y="-2" width="4" height="4" fill="url(#goldGrad)" rx="1" />
    <rect x="14" y="-2" width="4" height="4" fill="url(#goldGrad)" rx="1" />
    <rect x="-13" y="-13" width="4" height="4" fill="url(#goldGrad)" rx="1" transform="rotate(45)" />
    <rect x="10" y="-13" width="4" height="4" fill="url(#goldGrad)" rx="1" transform="rotate(45)" />
    <rect x="-13" y="10" width="4" height="4" fill="url(#goldGrad)" rx="1" transform="rotate(45)" />
    <rect x="10" y="10" width="4" height="4" fill="url(#goldGrad)" rx="1" transform="rotate(45)" />
  </g>

  <!-- Torch of Wisdom / Flame (Center Bottom) -->
  <g transform="translate(100, 138)">
    <path d="M -6 12 L 6 12 L 4 20 L -4 20 Z" fill="url(#goldGrad)" />
    <path d="M 0 0 C -8 -6, -4 -16, 0 -22 C 4 -16, 8 -6, 0 0 Z" fill="#f59e0b" />
    <path d="M 0 -2 C -4 -7, -2 -13, 0 -17 C 2 -13, 4 -7, 0 -2 Z" fill="#fef08a" />
  </g>

  <!-- Banner: SSM CONNECT -->
  <g transform="translate(100, 178)">
    <rect x="-56" y="-8" width="112" height="16" rx="4" fill="#0b1b36" stroke="#fcd34d" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="9" fill="#fef08a" letter-spacing="1.5">SSM CONNECT</text>
  </g>
</svg>

